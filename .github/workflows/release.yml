name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select release bump type'
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      release_name:
        description: 'Optional release title'
        required: false
      release_body:
        description: 'Optional release notes'
        required: false
      draft:
        description: 'Create a draft release'
        required: false
        default: false
      prerelease:
        description: 'Create a prerelease'
        required: false
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine new version tag
        id: version
        run: |
          current_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Current tag: $current_tag"
          semver_regex='^v?([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if [[ "$current_tag" =~ $semver_regex ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
          else
            major=0
            minor=0
            patch=0
          fi
          case "${{ github.event.inputs.release_type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown release type: ${{ github.event.inputs.release_type }}"
              exit 1
              ;;
          esac
          new_tag="v${major}.${minor}.${patch}"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}

      - name: Create release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          release_name: ${{ github.event.inputs.release_name || steps.version.outputs.new_tag }}
          body: ${{ github.event.inputs.release_body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Package repository for release
        run: |
          mkdir -p release
          zip -r release/release-${NEW_TAG}.zip . -x "RELEASE" ".vscode/*" "README.md" "release/*" "*.git*"
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: release/release-${{ steps.version.outputs.new_tag }}.zip
          asset_name: release-${{ steps.version.outputs.new_tag }}.zip
          asset_content_type: application/zip
